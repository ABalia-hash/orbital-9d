<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbital 9D — Гравитация</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;color:#eaf3ff;background:radial-gradient(circle at 15% 10%,#274b9d 0,transparent 38%),radial-gradient(circle at 85% 75%,#442a83 0,transparent 45%),#090f27;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:24px 16px}.hero{text-align:center;padding:22px 0}.hero h1{font-size:clamp(32px,7vw,56px);margin:0;background:linear-gradient(90deg,#70e9ff,#d5a5ff);color:transparent;background-clip:text}.sub{color:#bacbea}.panel{background:#101b39e8;border:1px solid #5871b6;border-radius:22px;padding:24px;box-shadow:0 20px 65px #0007}button,input,select{font:inherit}button{border:0;border-radius:13px;padding:13px 17px;cursor:pointer;background:#45d5f1;color:#07132c;font-weight:750}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#26385e;color:#fff}.tabs{display:flex;gap:10px;margin-bottom:18px}.tabs button{flex:1}.tabs .active{background:#45d5f1;color:#07132c}label{display:block;margin:14px 0 7px;font-weight:650}input,select{width:100%;padding:13px;background:#0c1732;color:white;border:1px solid #6e84b9;border-radius:12px}option{color:#111}.hidden{display:none}.question{font-size:23px;font-weight:750;margin:18px 0}.option{display:block;width:100%;text-align:left;margin:10px 0;padding:16px;background:#192b52;color:#f3f6ff;border:1px solid #425d96}.option.selected{background:#204f76;border:2px solid #4de0f8}.bar{height:10px;background:#27365b;border-radius:99px;overflow:hidden}.bar>div{height:100%;width:0;background:#55e5ed;transition:width .3s}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:#bbcae8}.error{color:#ff9d9d;white-space:pre-wrap}.success{color:#78edb7}.score{font-size:60px;font-weight:850;color:#68e5f1;text-align:center}.result{background:#17284b;padding:14px;border-radius:12px;margin:10px 0}.small{font-size:13px}.badge{display:inline-block;padding:5px 12px;border-radius:50px;background:#29477a}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #40547b;text-align:left}th{color:#9adceb}.scroll{overflow-x:auto}footer{text-align:center;color:#aabbd7;font-size:12px;margin-top:25px}</style></head><body><div class="wrap"><header class="hero"><div style="font-size:44px">🪐 🚀 ✨</div><h1>ORBITAL 9D</h1><p class="sub">Физика · 9 «Д» класс · Закон всемирного тяготения</p></header><main class="panel"><div class="tabs"><button id="studentTab" class="active" onclick="tab('student')">👩‍🚀 Ученик</button><button id="teacherTab" class="secondary" onclick="tab('teacher')">📊 Учитель</button></div><section id="login"><h2>Начать космическую миссию</h2><p class="muted">6 вопросов · 3 варианта · максимум 10 баллов</p><label for="student">Выберите своё имя</label><select id="student"><option value="">— Выберите ученика —</option></select><label for="code">Личный код ученика</label><input id="code" type="password" autocomplete="off" placeholder="Введите код, выданный учителем"><p id="loginErr" class="error"></p><button id="startBtn" onclick="start()">🚀 Начать тест</button></section><section id="quiz" class="hidden"><div class="row"><span id="who" class="badge"></span><span id="progressText" class="muted"></span></div><div class="bar" style="margin-top:15px"><div id="progressBar"></div></div><div class="question" id="question"></div><div id="options"></div><p id="quizErr" class="error"></p><div class="row"><span id="points" class="muted"></span><button id="nextBtn" onclick="next()" disabled>Сохранить ответ →</button></div></section><section id="done" class="hidden"><h2 style="text-align:center">🎉 Миссия завершена!</h2><div class="score" id="score"></div><p style="text-align:center">Ваш результат из 10 баллов</p><p class="muted" style="text-align:center">Результат сохранён для учителя.</p></section><section id="teacher" class="hidden"><h2>Панель учителя</h2><label for="teacherPassword">Пароль учителя</label><input id="teacherPassword" type="password" placeholder="Пароль"><p id="teacherErr" class="error"></p><button onclick="loadTeacher()">Обновить результаты</button><div id="teacherResults" style="margin-top:20px"></div></section></main><footer>Orbital 9D · Интерактивная проверка знаний</footer></div><script>
const API='https://vnvxdnhkqjcsbxjarqcb.supabase.co/functions/v1/smorbital-test-art-responder';
const students=['Аманжолов Нурали','Аскенбай Дария','Байбатуров Дамир','Батырұлы Мұхаммед','Джиенбаев Аллаяр','Дильмуратов Ислам','Доспан Ибрахим','Еділ Дінмұхамед','Имаматдин Айша','Исмаилов Али','Кенжебай Амина','Қалдаш Ясина','Қалдаш Иманғали','Қанат Аиша','Лебай Інжумаржан','Осин Матвей','Өмірзақ Перизат','Садыбек Айбын','Салауат Ақылбек','Сатова Дария','Сламбек Аружан','Тимур Тәңірберген','Харченко Вероника','Шопан Абылай'];
const $=id=>document.getElementById(id); students.forEach(s=>{let o=document.createElement('option');o.value=s;o.textContent=s;$('student').append(o)});
let session=null, index=0, selected=null, busy=false;
function show(id){['login','quiz','done','teacher'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function tab(t){$('studentTab').className=t==='student'?'active':'secondary';$('teacherTab').className=t==='teacher'?'active':'secondary';show(t==='student'?'login':'teacher')}
async function call(body){let response=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let data=await response.json().catch(()=>({error:'Сервер вернул не JSON'}));if(!response.ok||data.error)throw new Error(data.error||'Ошибка сервера: '+response.status);return data}
async function start(){if(busy)return;$('loginErr').textContent='';let name=$('student').value,code=$('code').value;if(!name||!code){$('loginErr').textContent='Выберите имя и введите код';return}busy=true;$('startBtn').disabled=true;try{let data=await call({action:'start',student_name:name,code});if(!data.token||!Array.isArray(data.questions)||data.questions.length!==6)throw Error('Сервер вернул неполные данные');session={token:data.token,questions:data.questions,name,variant:data.variant};index=0;show('quiz');render()}catch(e){$('loginErr').textContent='Не удалось начать: '+e.message+'\nПроверьте коды учеников и сервер.'}finally{busy=false;$('startBtn').disabled=false}}
function render(){selected=null;$('nextBtn').disabled=true;$('quizErr').textContent='';$('who').textContent=session.name+' · Вариант '+session.variant;$('progressText').textContent=(index+1)+' / 6';$('progressBar').style.width=(index/6*100)+'%';$('question').textContent=session.questions[index].q;$('points').textContent='За вопрос: '+(index<4?'1 балл':'3 балла');$('nextBtn').textContent=index===5?'Завершить тест':'Сохранить ответ →';$('options').replaceChildren();session.questions[index].a.forEach((a,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+a;b.onclick=()=>{selected=i;[...$('options').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('nextBtn').disabled=false};$('options').append(b)})}
async function next(){if(busy||selected===null)return;busy=true;$('nextBtn').disabled=true;$('quizErr').textContent='';try{await call({action:'answer',token:session.token,question_index:index,answer:selected});if(index===5){let result=await call({action:'finish',token:session.token});$('score').textContent=result.score+' / '+result.max_score;show('done')}else{index++;render()}}catch(e){$('quizErr').textContent='Не удалось сохранить: '+e.message+' — повторите попытку';$('nextBtn').disabled=false}finally{busy=false}}
async function loadTeacher(){$('teacherErr').textContent='';let pw=$('teacherPassword').value;if(!pw){$('teacherErr').textContent='Введите пароль';return}try{let data=await call({action:'teacher',password:pw});let map=new Map();(data.results||[]).forEach(r=>{if(!map.has(r.student_name))map.set(r.student_name,r)});let wrap=document.createElement('div');let summary=document.createElement('p');summary.className='muted';summary.textContent='Завершили: '+[...map.values()].filter(x=>x.status==='finished').length+' / '+students.length;wrap.append(summary);let scroll=document.createElement('div');scroll.className='scroll';let table=document.createElement('table');let head=document.createElement('tr');['Ученик','Вариант','Прогресс','Баллы','Статус'].forEach(s=>{let th=document.createElement('th');th.textContent=s;head.append(th)});table.append(head);students.forEach(name=>{let r=map.get(name),tr=document.createElement('tr');[name,r?.variant??'—',r?((r.progress??0)+'/6'):'—',r?.score??'—',r?(r.status==='finished'?'Завершил':'Проходит'):'Не начинал'].forEach(s=>{let td=document.createElement('td');td.textContent=String(s);tr.append(td)});table.append(tr)});scroll.append(table);wrap.append(scroll);$('teacherResults').replaceChildren(wrap)}catch(e){$('teacherErr').textContent='Не удалось получить результаты: '+e.message}}
</script></body></html>
